name: web3-audit
version: 1.0.0
description: Smart contract security audit — 10 DeFi bug classes, pre-dive kill signals, Foundry PoC template, grep patterns per class. Static review is passive; on-chain interaction is intrusive.
bounded_context: SmartContractContext
safety_tier: passive
owasp_wstg: []
owasp_api_top10: []
severity_range: [low, medium, high, critical]
tools_required:
  - python3
  - date
rate_limit: 10
input_files: []
workflows:
  audit-contract:
    description: Grep-pattern audit of Solidity contracts by bug class (static, local files only)
    safety_tier: passive
    inputs: [CONTRACTS_DIR, OUTDIR]
    command: |
      mkdir -p $OUTDIR/web3 && \
      python3 .claude/skills/web3-audit/scripts/sol_pattern_scan.py --dir "${CONTRACTS_DIR:?Set CONTRACTS_DIR}" > $OUTDIR/web3/contract_scan.txt
    outputs:
      - $OUTDIR/web3/contract_scan.txt
    evidence_dir: $OUTDIR/web3/evidence/
    detection_signals:
      - "pattern hits across accounting, access control, oracle, reentrancy, proxy classes"
    false_positives:
      - "patterns flag candidates — every hit needs manual review against real state flow"
    next:
      if_findings: token-scan
      if_no_findings: token-scan

  token-scan:
    description: Token red-flag scanner for EVM and Solana token sources (static, local files only)
    safety_tier: passive
    inputs: [CONTRACTS_DIR, OUTDIR]
    command: |
      mkdir -p $OUTDIR/web3 && \
      python3 .claude/skills/web3-audit/scripts/token_scanner.py "${CONTRACTS_DIR:?Set CONTRACTS_DIR}" --recursive > $OUTDIR/web3/token_scan.txt
    outputs:
      - $OUTDIR/web3/token_scan.txt
    evidence_dir: $OUTDIR/web3/evidence/
    detection_signals:
      - "hidden mint, honeypot restrictions, fee manipulation, authority retention patterns"
    false_positives:
      - "regex-based scanner misses obfuscation and cannot confirm on-chain state"
    next:
      if_findings: null
      if_no_findings: null

evidence_templates:
  contract_scan: "Pattern-scan output grouped by bug class with file:line references"
  token_scan: "Token scanner report with matched rule per finding"
  foundry_poc: "Foundry test PoC with fork block, exploit steps, and assertion"
