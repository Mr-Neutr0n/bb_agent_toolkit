# Pragmatic lint config for BountyHarness.
# The codebase intentionally uses broad exception handling when parsing
# 45 skill packages' YAML of varying quality - one bad file must never
# abort an audit run. Those patterns are ignored; real defect classes
# (unused imports/vars, f-string bugs, deprecated imports) stay enforced.

target-version = "py311"
line-length = 200

[lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "BLE001",   # blind except: intentional around per-skill parsing
    "S110",     # try-except-pass: same reason
    "S112",     # try-except-continue: same reason
    "SIM102",   # collapsible-if: readability preference
    "SIM114",   # if-with-same-arms: often semantically distinct here
    "PERF102",  # dict iterator: clarity over micro-perf
    "PLW1510",  # subprocess without check: return codes handled manually
    "UP006",    # keep typing.List style for py3.8-era compat files
    "UP035",
    "UP007",
]

[lint.per-file-ignores]
# Shell-out helpers and adapters do lots of defensive subprocess handling
"tools/adapters/*" = ["F401"]
